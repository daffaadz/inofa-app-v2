services:
    # PHP Application
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                user: laravel
                uid: 1000
        container_name: inofa-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
            - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
        networks:
            - inofa-network
        depends_on:
            - mysql
            - redis
            - meilisearch

    # Nginx Web Server
    nginx:
        image: nginx:alpine
        container_name: inofa-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - inofa-network
        depends_on:
            - app

    # MySQL Database
    mysql:
        image: mysql:8.0
        container_name: inofa-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-inofa}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_USER: ${DB_USERNAME:-inofa}
        command: --log-bin-trust-function-creators=1
        ports:
            - "3307:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - inofa-network

    # Redis Cache
    redis:
        image: redis:alpine
        container_name: inofa-redis
        restart: unless-stopped
        ports:
            - "6380:6379"
        volumes:
            - redis-data:/data
        networks:
            - inofa-network

    # Meilisearch for Laravel Scout
    meilisearch:
        image: getmeili/meilisearch:latest
        container_name: inofa-meilisearch
        restart: unless-stopped
        environment:
            MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
            MEILI_NO_ANALYTICS: true
        ports:
            - "7700:7700"
        volumes:
            - meilisearch-data:/meili_data
        networks:
            - inofa-network

    # Queue Worker
    queue:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                user: laravel
                uid: 1000
        container_name: inofa-queue
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
        volumes:
            - ./:/var/www
        networks:
            - inofa-network
        depends_on:
            - app
            - mysql
            - redis

    # Node.js for Vite (Development)
    node:
        image: node:20-alpine
        container_name: inofa-node
        working_dir: /var/www
        volumes:
            - ./:/var/www
        ports:
            - "5173:5173"
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        networks:
            - inofa-network
        profiles:
            - dev

networks:
    inofa-network:
        driver: bridge

volumes:
    mysql-data:
        driver: local
    redis-data:
        driver: local
    meilisearch-data:
        driver: local
